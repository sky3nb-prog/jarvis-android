name: Jarvis Konto (Test-App) bauen

on:
  push:
    branches: [konto]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android-SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis-Konto.apk
      # eigener Download – die normale Jarvis-App („neueste“) bleibt unberührt
      - name: Als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: konto-neueste
          name: "Jarvis Konto – Test (Build ${{ github.run_number }})"
          body: |
            Test-App mit Jarvis-Konto. Installiert sich NEBEN der normalen Jarvis-App.
            Build ${{ github.run_number }} · ${{ github.event.head_commit.message }}
          files: Jarvis-Konto.apk
          make_latest: false
          prerelease: true
