name: Jarvis App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Das Android-SDK ist auf den GitHub-Rechnern schon installiert
      - name: Android-SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APKs umbenennen
        run: |
          cp app/build/outputs/apk/privat/release/app-privat-release.apk Jarvis.apk
          cp app/build/outputs/apk/konto/release/app-konto-release.apk Jarvis-Konto.apk

      - name: Als Download bereitstellen (immer der neueste Stand)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: "Jarvis – neueste Version (Build ${{ github.run_number }})"
          body: |
            Zum Installieren auf dem Handy: **Jarvis.apk** antippen, herunterladen, öffnen, „Installieren“.
            Build ${{ github.run_number }} · ${{ github.event.head_commit.message }}
          files: Jarvis.apk
          make_latest: true

      # Die App für alle (von der Website): gleicher Stand, eigene App, aktualisiert sich selbst
      - name: Konto-App bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: konto-neueste
          name: "Jarvis (Build ${{ github.run_number }})"
          body: |
            Jarvis fürs Handy. Build ${{ github.run_number }} · ${{ github.event.head_commit.message }}
          files: Jarvis-Konto.apk
          make_latest: false
          prerelease: true
