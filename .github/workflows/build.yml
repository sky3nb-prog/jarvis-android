name: Jarvis App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - name: Als Download bereitstellen (immer der neueste Stand)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: "Jarvis – neueste Version (Build ${{ github.run_number }})"
          body: |
            Zum Installieren auf dem Handy: **Jarvis.apk** antippen, herunterladen, öffnen, „Installieren“.
            Build ${{ github.run_number }} · ${{ github.event.head_commit.message }}
          files: Jarvis.apk
          make_latest: true
