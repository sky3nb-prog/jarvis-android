<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Jarvis Start</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#ffe1b4;cursor:none;user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%}
.c{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(46vh,46vw);height:min(46vh,46vw)}
.c canvas{position:absolute;inset:0;width:100%;height:100%}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,190,90,.35);transform:scale(.2);opacity:0}
.ring.r1{inset:-9%;border-style:dashed;animation:ringin 1.2s .3s forwards,spin 26s linear infinite}
.ring.r2{inset:-18%;border-width:2px;border-color:rgba(255,170,40,.18) rgba(255,214,120,.8) rgba(255,170,40,.18) rgba(255,170,40,.18);animation:ringin 1.2s .55s forwards,spin2 9s linear infinite}
.ring.r3{inset:-28%;border-color:rgba(60,200,255,.18);border-style:dotted;animation:ringin 1.2s .8s forwards,spin 40s linear infinite reverse}
@keyframes ringin{to{opacity:1;transform:scale(1)}}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
@keyframes spin2{from{rotate:0deg}to{rotate:-360deg}}
#sph,#brn{opacity:0;transform:scale(.3);transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,1.2,.3,1)}
.on #sph,.on #brn{opacity:1;transform:scale(1)}
#title{position:absolute;left:0;right:0;top:calc(46% + min(30vh,30vw));text-align:center;font-size:min(5.2vh,4vw);letter-spacing:.5em;font-weight:600;color:#ffd678;text-shadow:0 0 24px rgba(255,170,40,.6)}
#title span{opacity:0;display:inline-block;transform:translateY(8px);transition:opacity .25s,transform .25s}
#title span.v{opacity:1;transform:none}
#sub{position:absolute;left:0;right:0;top:calc(46% + min(30vh,30vw) + min(7.5vh,6vw));text-align:center;font-size:min(2.4vh,1.8vw);letter-spacing:.18em;color:#c8965a;opacity:0;transition:opacity .8s}
#sub.v{opacity:1}
#sys{position:absolute;right:5vw;top:18vh;width:min(30vw,420px);font-size:min(1.9vh,1.4vw)}
#sys h4{margin:0 0 10px;font-size:.8em;letter-spacing:.3em;color:#c8965a;font-weight:700;opacity:0;transition:opacity .5s}
#sys h4.v{opacity:1}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,170,40,.10);opacity:0;transform:translateX(30px);transition:opacity .35s,transform .35s}
.row.v{opacity:1;transform:none}
.row i{flex:0 0 9px;height:9px;border-radius:50%;background:#555}
.row.g i{background:#6effcd;box-shadow:0 0 10px #6effcd}.row.r i{background:#ff6a4a;box-shadow:0 0 10px #ff6a4a}
.row b{font-weight:600;color:#ffe1b4;flex:1}.row small{color:#78a0b4}
#left{position:absolute;left:5vw;top:18vh;font-family:Consolas,monospace;font-size:min(1.6vh,1.2vw);color:rgba(110,200,255,.75);line-height:1.6;white-space:pre}
#welcome{position:absolute;left:0;right:0;bottom:4.5vh;text-align:center;font-size:min(3.4vh,2.6vw);color:#ffe9c8;letter-spacing:.08em;opacity:0;transition:opacity 1s}
#welcome.v{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 1.2s;pointer-events:none}
#fade.off{opacity:0}
#skip{position:absolute;right:20px;bottom:14px;font-size:11px;color:#5a4a30;letter-spacing:.1em}
</style></head><body>
<canvas id="bg"></canvas>
<div class="c"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <canvas id="sph"></canvas><canvas id="brn"></canvas></div>
<div id="title"></div><div id="sub">PERSÖNLICHER ASSISTENT · ONLINE</div>
<div id="left"></div>
<div id="sys"><h4 id="sysh">SYSTEMSTATUS</h4><div id="rows"></div></div>
<div id="welcome"></div>
<div id="skip">Klick oder Esc = überspringen</div>
<div id="fade"></div>
<script src="sphere3d.js"></script><script src="brain.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search), name = q.get("name") || "Sir";
  const $ = (id) => document.getElementById(id);
  const cv = $("bg"), g = cv.getContext("2d");
  let W, H; const dpr = Math.min(2, devicePixelRatio || 1);
  function size() { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener("resize", size);
  // Hintergrund: Hex-Gitter, das sich von der Mitte aus aufbaut, plus goldene Leitungen zur Kugel
  const t0 = performance.now();
  const lines = Array.from({ length: 16 }, (_, i) => ({ a: (i / 16) * Math.PI * 2 + Math.random() * .2, r0: .2 + Math.random() * .1, w: .5 + Math.random(), sp: .6 + Math.random() * .8, ph: Math.random() * 6 }));
  let sphere = null, brain = null;
  try { sphere = new Sphere3D($("sph"), 3); brain = new JarvisBrain($("brn"), sphere); brain.scale = .8; sphere.state = "thinking"; } catch (e) {}
  let last = t0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * .46, R = Math.min(W, H) * .23;
    // Hex-Gitter
    const s = 34, reveal = Math.min(1, t / 2.2) * Math.hypot(W, H) * .7;
    g.lineWidth = 1;
    for (let y = -s; y < H + s; y += s * .866) for (let x = (Math.round(y / (s * .866)) % 2) * s / 2 - s; x < W + s; x += s) {
      const d = Math.hypot(x - cx, y - cy); if (d > reveal) continue;
      const a = Math.max(0, .09 - d / Math.hypot(W, H) * .1) * (1 - Math.max(0, d - reveal + 120) / 120);
      if (a <= 0) continue; g.strokeStyle = `rgba(255,170,40,${a})`; g.beginPath();
      for (let k = 0; k < 6; k++) { const an = Math.PI / 3 * k + Math.PI / 6; const px = x + Math.cos(an) * s * .5, py = y + Math.sin(an) * s * .5; k ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.closePath(); g.stroke();
    }
    // goldene Leitungen, die zur Kugel wachsen
    g.globalCompositeOperation = "lighter";
    for (const l of lines) {
      const grow = Math.min(1, Math.max(0, (t - .2) / 1.6)); const r1 = R * 1.6, r2 = R * (1.62 + 2.5 * (1 - grow));
      const x1 = cx + Math.cos(l.a) * (r1 + Math.max(W, H) * .5 * grow * .0), y1 = cy + Math.sin(l.a) * r1;
      const xe = cx + Math.cos(l.a) * Math.max(W, H), ye = cy + Math.sin(l.a) * Math.max(W, H);
      const bend = Math.sin(t * l.sp + l.ph) * 40;
      g.strokeStyle = `rgba(255,190,90,${.09 * grow})`; g.lineWidth = l.w * 3; g.beginPath(); g.moveTo(xe, ye);
      g.quadraticCurveTo((xe + x1) / 2 + bend, (ye + y1) / 2 - bend, cx + Math.cos(l.a) * r2, cy + Math.sin(l.a) * r2); g.stroke();
      g.strokeStyle = `rgba(255,214,120,${.38 * grow})`; g.lineWidth = l.w; g.stroke();
      const u = ((t * l.sp * .5 + l.ph) % 1); // Impuls Richtung Kugel
      const px = xe + (cx + Math.cos(l.a) * r2 - xe) * u, py = ye + (cy + Math.sin(l.a) * r2 - ye) * u;
      const gr = g.createRadialGradient(px, py, 0, px, py, 8); gr.addColorStop(0, `rgba(255,240,200,${.9 * grow})`); gr.addColorStop(1, "rgba(255,200,110,0)");
      g.fillStyle = gr; g.fillRect(px - 8, py - 8, 16, 16);
    }
    g.globalCompositeOperation = "source-over";
    if (sphere) { sphere.level = .15 + .1 * Math.sin(t * 3); try { sphere.draw(dt); brain && brain.draw(dt); } catch (e) {} }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => $("fade").classList.add("off"), 50);
  setTimeout(() => document.body.classList.add("on"), 600);
  // Titel Buchstabe für Buchstabe
  const T = "J.A.R.V.I.S."; $("title").innerHTML = [...T].map((c) => `<span>${c}</span>`).join("");
  [...$("title").children].forEach((sp, i) => setTimeout(() => sp.classList.add("v"), 1400 + i * 90));
  setTimeout(() => $("sub").classList.add("v"), 2600);
  // Konsole links
  const log = ["> Kern wird geladen …", "> Sprachmodul: Friday", "> Gedächtnis synchronisiert", "> Neuronales Netz online", "> Hologramm-Schnittstelle aktiv", "> Verbindung zum Handy …"];
  log.forEach((l, i) => setTimeout(() => { $("left").textContent += l + "\n"; }, 700 + i * 420));
  // Systemstatus rechts (echte Prüfung)
  let items = [];
  const shown = fetch("/api/syscheck?neu=1").then((r) => r.json()).then((d) => { items = d.items || []; }).catch(() => {});
  setTimeout(async () => {
    $("sysh").classList.add("v");
    await Promise.race([shown, new Promise((r) => setTimeout(r, 5000))]);
    const list = items.filter((i) => i.ok !== null).slice(0, 12);
    list.forEach((i, k) => setTimeout(() => {
      const d = document.createElement("div"); d.className = "row " + (i.ok ? "g" : "r");
      d.innerHTML = `<i></i><b>${i.name}</b><small>${i.ok ? "OK" : i.detail}</small>`; $("rows").appendChild(d);
      requestAnimationFrame(() => d.classList.add("v"));
    }, k * 160));
    const bad = list.filter((i) => !i.ok).length;
    setTimeout(() => {
      $("welcome").textContent = bad ? `Willkommen zurück, ${name}. ${bad} System${bad > 1 ? "e brauchen" : " braucht"} Aufmerksamkeit.` : `Willkommen zurück, ${name}. Alle Systeme bereit.`;
      $("welcome").classList.add("v");
      if (sphere) sphere.state = "speaking";
      try { fetch("/api/boot_done", { method: "POST", body: JSON.stringify({ bad }) }); } catch (e) {}
    }, list.length * 160 + 400);
    setTimeout(end, list.length * 160 + 4200);
  }, 1800);
  let ended = false;
  function end() {
    if (ended) return; ended = true;
    $("fade").classList.remove("off");
    setTimeout(() => { try { window.pywebview && window.pywebview.api.close(); } catch (e) {} ; try { fetch("/api/boot_close", { method: "POST", body: "{}" }); } catch (e) {} }, 1300);
  }
  addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === " " || e.key === "Enter") end(); });
  addEventListener("click", end);
  setTimeout(end, 16000);   // spätestens nach 16 s
})();
</script>
</body></html>
