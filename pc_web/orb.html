<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Jarvis Orb</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
#nerv{position:absolute;inset:0;width:100%;height:100%}
#orb{position:absolute;width:86px;height:86px;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .3s}
#orb.on{transform:scale(1);opacity:1}
#orb canvas{position:absolute;inset:0;width:100%;height:100%}
#ring{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(255,190,90,.6);box-shadow:0 0 16px rgba(255,170,40,.5),inset 0 0 12px rgba(255,170,40,.25)}
#pill{position:absolute;max-width:400px;padding:9px 15px;border-radius:18px;background:rgba(12,9,4,.92);border:1px solid #6b4a14;
  box-shadow:0 0 18px rgba(255,170,40,.2);opacity:0;transform:translateX(-12px);transition:opacity .3s,transform .35s}
#pill.on{opacity:1;transform:none}
body.r #pill{transform:translateX(12px)} body.r #pill.on{transform:none}
#pill small{display:block;font-size:10px;letter-spacing:.16em;color:#c8965a;font-weight:700}
#pill b{display:block;font-size:14px;color:#ffe1b4;font-weight:500;margin-top:3px;line-height:1.3;max-height:3.9em;overflow:hidden}
#pill b.you{color:#6ec8ff}
.bars{display:inline-flex;gap:2px;margin-left:6px;vertical-align:-1px;height:11px;align-items:flex-end}.bars i{width:3px;background:#ffd678;border-radius:2px;display:block;height:3px;transition:height .08s}
</style></head><body>
<canvas id="nerv"></canvas>
<div id="orb"><div id="ring"></div><canvas class="sphere" id="sph"></canvas><canvas class="brain" id="brn"></canvas></div>
<div id="pill"><small id="who">FRIDAY</small><b id="txt"></b></div>
<script src="sphere3d.js"></script><script src="brain.js"></script><script src="orb.js"></script>
</body></html>
